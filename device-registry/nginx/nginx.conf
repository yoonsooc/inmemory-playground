# 로컬 실험용 라운드로빈 LB.  실행: nginx -p $PWD/nginx -c nginx.conf    종료: nginx -p $PWD/nginx -s stop
daemon off;
pid nginx.pid;
error_log error.log warn;
worker_processes 1;

events { worker_connections 1024; }

http {
    access_log access.log;

    upstream device_registry {
        server 127.0.0.1:8081;   # app-1
        server 127.0.0.1:8082;   # app-2
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://device_registry;

            # SSE에 필요한 설정. 서버 ping(10s)이 있으므로 read_timeout은 그보다 길기만 하면 된다.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;

            add_header X-Upstream $upstream_addr always;  # 어느 앱이 처리했는지 확인용
        }
    }
}
